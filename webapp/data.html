<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebApp - Base de donnees</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .explorer-toolbar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .explorer-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .explorer-search {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .explorer-search-input {
      min-width: 260px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .data-files-row > td {
      background: rgba(0, 0, 0, 0.03);
      padding: 0 12px 12px;
    }

    .data-files-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
    }

    .data-files-table th,
    .data-files-table td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .data-files-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
    }

    .data-expand {
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      padding: 0 6px 0 0;
      color: inherit;
    }

    .data-chant-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      vertical-align: -3px;
      margin-right: 6px;
    }

    .data-dialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
    }

    .data-dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      min-width: min(460px, 92vw);
    }

    .data-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 12px 0 16px;
    }

    .data-form-grid label {
      display: grid;
      gap: 4px;
      font-size: 0.9em;
    }

    .data-form-grid label[hidden] {
      display: none;
    }

    .data-form-grid input[type="text"],
    .data-form-grid input[type="number"],
    .data-form-grid input[type="search"],
    .data-form-grid select,
    .data-form-grid textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .data-form-grid .data-checkbox {
      grid-auto-flow: column;
      justify-content: start;
      align-items: center;
      gap: 8px;
    }

    .data-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .auteur-picker {
      position: relative;
    }

    .auteur-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .auteur-chips:empty {
      margin-bottom: 0;
    }

    .auteur-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft, #e2e8f0);
      color: var(--ink);
      font-size: 0.85em;
    }

    .auteur-chip-remove {
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
      line-height: 1;
      color: inherit;
      opacity: 0.7;
      padding: 2px 4px;
    }

    .auteur-chip-remove:hover {
      opacity: 1;
    }

    .auteur-suggestions-list {
      position: absolute;
      z-index: 5;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .auteur-suggestions-list[hidden] {
      display: none;
    }

    .auteur-suggestion-item {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: none;
      text-align: left;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
    }

    .auteur-suggestion-item:hover,
    .auteur-suggestion-item:focus {
      background: var(--accent-soft, #e2e8f0);
    }

    .auteur-suggestion-item.is-add-new {
      color: var(--accent, #0f766e);
      font-weight: 600;
    }
  </style>
  <script>
    (async () => {
      try {
        const AUTH_API = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.AUTH_API)
          || `${(window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || ''}webapp/api/auth.php`;
        const res = await fetch(`${AUTH_API}?action=check`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) {
          const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
          window.location.replace(`./login.html?return=${returnUrl}`);
        }
      } catch {
        const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
        window.location.replace(`./login.html?return=${returnUrl}`);
      }
    })();
  </script>
</head>
<body>
  <div class="explorer-toolbar">
    <div class="explorer-actions">
      <button id="go-up" class="btn btn-ghost icon-btn" type="button" title="Monter" aria-label="Monter">
        <span class="icon-glyph" aria-hidden="true">&uarr;</span><span class="sr-only">Monter</span>
      </button>
      <button id="refresh-list" class="btn btn-ghost icon-btn" type="button" title="Rafraichir" aria-label="Rafraichir">
        <span class="icon-glyph" aria-hidden="true">&#x21bb;</span><span class="sr-only">Rafraichir</span>
      </button>
      <button id="new-chant" class="btn" type="button" title="Nouveau chant">Nouveau chant</button>
      <button id="edit-chant" class="btn btn-ghost" type="button" title="Modifier le chant" disabled>Modifier</button>
      <button id="delete-chant" class="btn btn-danger" type="button" title="Supprimer le chant" disabled>Supprimer</button>
      <button id="advanced-search" class="btn btn-ghost" type="button" title="Recherche avancee">Recherche</button>
    </div>
    <div class="explorer-search">
      <input id="data-search-input" class="explorer-search-input" type="search" placeholder="Rechercher un chant ou un fichier" aria-label="Rechercher un chant ou un fichier" />
    </div>
  </div>

  <div class="breadcrumbs" id="breadcrumbs" aria-label="Chemin courant"></div>

  <div class="explorer-list-wrap">
    <table class="explorer-table" aria-describedby="data-status">
      <thead>
        <tr>
          <th>Nom</th>
          <th data-chant-column>Cote</th>
          <th data-chant-column>Fichiers</th>
          <th data-chant-column>Informations</th>
        </tr>
      </thead>
      <tbody id="data-body"></tbody>
    </table>
  </div>

  <p class="hint" id="data-status" role="status">Initialisation de la base...</p>

  <dialog id="chant-dialog" class="data-dialog">
    <form id="chant-form" method="dialog">
      <h2 id="chant-dialog-title">Nouveau chant</h2>
      <div class="data-form-grid">
        <label>Nom
          <input type="text" name="nom" maxlength="255" required />
        </label>
        <label>Dossier (Path)
          <input type="text" name="path" maxlength="500" pattern="[^/\\]*" title="Un seul nom de dossier, sans /" placeholder="ex: Entree" />
        </label>
        <label>Cote
          <input type="text" name="cote" maxlength="20" />
        </label>
        <label>Auteurs
          <div class="auteur-picker" id="auteur-picker">
            <div class="auteur-chips" id="auteur-chips"></div>
            <input type="text" id="auteur-search" placeholder="Rechercher un auteur existant ou en saisir un nouveau" autocomplete="off" />
            <div class="auteur-suggestions-list" id="auteur-suggestions-list" hidden></div>
          </div>
          <input type="hidden" name="auteurs" id="auteurs-hidden" />
        </label>
        <label>Categories
          <div class="auteur-picker" id="categorie-picker">
            <div class="auteur-chips" id="categorie-chips"></div>
            <input type="text" id="categorie-search" placeholder="Rechercher une categorie existante ou en saisir une nouvelle" autocomplete="off" />
            <div class="auteur-suggestions-list" id="categorie-suggestions-list" hidden></div>
          </div>
          <input type="hidden" name="categories" id="categories-hidden" />
        </label>
        <label>Informations
          <textarea name="informations" rows="3" maxlength="5000"></textarea>
        </label>
      </div>
      <div class="data-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="file-dialog" class="data-dialog">
    <form id="file-form" method="dialog">
      <h2 id="file-dialog-title">Nouveau fichier</h2>
      <div class="data-form-grid">
        <label id="file-upload-field">Fichier a televerser
          <input type="file" name="file" accept=".pdf,.mp3,.m4a,.musicxml,.mxl,.xml" />
        </label>
        <label>Nom du fichier
          <input type="text" name="nom_fichier" maxlength="255" required />
        </label>
        <label>Tonalite
          <input type="text" name="tonalite" maxlength="16" placeholder="ex: Do majeur" />
        </label>
        <label>Nombre de voix
          <input type="number" name="nb_voix" min="0" max="32" step="1" />
        </label>
        <label class="data-checkbox">
          <input type="checkbox" name="accords" />
          Accords
        </label>
        <label>Informations
          <textarea name="informations" rows="3" maxlength="5000"></textarea>
        </label>
      </div>
      <div class="data-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="move-dialog" class="data-dialog">
    <form id="move-form" method="dialog">
      <h2>Deplacer le fichier</h2>
      <div class="data-form-grid">
        <label>Rechercher un chant
          <input id="move-search" type="search" placeholder="Nom du chant ou dossier" autocomplete="off" />
        </label>
        <label>Chant de destination
          <select name="chant_id" size="8" required></select>
        </label>
      </div>
      <div class="data-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Deplacer</button>
      </div>
    </form>
  </dialog>

  <script src="./data.js"></script>
</body>
</html>
