<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebApp - Bibliotheque</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .library-toolbar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .library-count {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .library-filter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .library-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .library-filter-select {
      min-width: 220px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .library-search-input {
      min-width: 240px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .library-dialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
    }

    .library-dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      min-width: min(460px, 92vw);
    }

    .library-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 12px 0 16px;
    }

    .library-form-grid label {
      display: grid;
      gap: 4px;
      font-size: 0.9em;
    }

    .library-form-grid input[type="text"],
    .library-form-grid input[type="date"],
    .library-form-grid input[type="search"],
    .library-form-grid select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .library-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .parties-list {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      max-height: 240px;
      overflow: auto;
    }

    .parties-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid var(--line);
    }

    .btn.btn-danger {
      max-width: 150px;
    }

    .partie-categories-list {
      display: grid;
      gap: 10px;
      max-height: 360px;
      overflow: auto;
      margin-bottom: 16px;
    }

    .partie-categories-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(200px, 2fr);
      gap: 10px;
      align-items: center;
    }

    .partie-categories-row select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
  </style>
  <script>
    (async () => {
      try {
        const AUTH_API = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.AUTH_API)
          || `${(window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || ''}webapp/api/auth.php`;
        const res = await fetch(`${AUTH_API}?action=check`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) {
          const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
          window.location.replace(`./login.html?return=${returnUrl}`);
        }
      } catch {
        const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
        window.location.replace(`./login.html?return=${returnUrl}`);
      }
    })();
  </script>
</head>
<body>
  <div class="library-toolbar">
    <div class="library-filter">
      <select id="library-paroisse-filter" class="library-filter-select" aria-label="Filtrer par paroisse">
        <option value="">Toutes les paroisses</option>
      </select>
      <input id="library-search-input" class="library-search-input" type="search" placeholder="Rechercher un programme" aria-label="Rechercher un programme" />
      <div class="library-actions">
        <button id="library-create-program" class="btn" type="button">Nouveau programme</button>
        <button id="library-delete" class="btn btn-danger" type="button" disabled>Supprimer</button>
        <button id="library-manage-parties" class="btn btn-ghost" type="button">Parties</button>
        <button id="library-manage-partie-categories" class="btn btn-ghost" type="button">Correspondance</button>
        <button id="library-refresh" class="btn btn-ghost icon-btn" type="button" title="Rafraichir la liste" aria-label="Rafraichir la liste">
          <span class="icon-glyph" aria-hidden="true">&#x21bb;</span><span class="sr-only">Rafraichir la liste</span>
        </button>
        <span id="library-count" class="library-count">0 programme</span>
      </div>
    </div>
  </div>

  <div class="explorer-list-wrap">
    <table class="explorer-table" aria-describedby="library-status">
      <thead>
        <tr>
          <th>Date</th>
          <th>Lieu</th>
          <th>Occasion</th>
          <th>Paroisse</th>
          <th>Contenu</th>
        </tr>
      </thead>
      <tbody id="library-body">
        <tr>
          <td colspan="5" class="empty-cell">Chargement de la bibliotheque...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p id="library-status" class="hint" role="status">En attente de chargement.</p>

  <dialog id="parties-dialog" class="library-dialog">
    <h2>Gestion des parties</h2>
    <form id="partie-create-form" method="dialog">
      <div class="library-form-grid">
        <label>Nouvelle partie
          <input type="text" name="nom" maxlength="255" required />
        </label>
      </div>
      <div class="library-dialog-actions">
        <button type="submit" class="btn">Ajouter</button>
      </div>
    </form>
    <ul id="parties-list" class="parties-list"></ul>
    <div class="library-dialog-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Fermer</button>
    </div>
  </dialog>

  <dialog id="partie-categories-dialog" class="library-dialog">
    <h2>Correspondance Partie / Categorie</h2>
    <p class="hint">Selectionnez, pour chaque partie, les categories associees (Ctrl/Cmd + clic pour en choisir plusieurs).</p>
    <div id="partie-categories-list" class="partie-categories-list"></div>
    <div class="library-dialog-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Fermer</button>
      <button type="button" id="partie-categories-save" class="btn">Enregistrer</button>
    </div>
  </dialog>

  <script src="./library.js"></script>
</body>
</html>
