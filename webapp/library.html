<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebApp - Bibliotheque</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .library-toolbar {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .library-count {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .library-filter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .library-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .library-filter-select {
      min-width: 320px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .library-search-input {
      min-width: 280px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
  </style>
  <script>
    (async () => {
      try {
        const AUTH_API = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.AUTH_API)
          || `${(window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || ''}webapp/api/auth.php`;
        const res = await fetch(`${AUTH_API}?action=check`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) {
          const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
          window.location.replace(`./login.html?return=${returnUrl}`);
        }
      } catch {
        const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
        window.location.replace(`./login.html?return=${returnUrl}`);
      }
    })();
  </script>
</head>
<body>
  <div class="library-toolbar">
    <div class="library-filter">
      <select id="library-folder-filter" class="library-filter-select" aria-label="Filtrer par dossier">
        <option value="">Tous les dossiers</option>
      </select>
      <input id="library-search-input" class="library-search-input" type="search" placeholder="Rechercher un fichier" aria-label="Rechercher un fichier" />
      <div class="library-actions">
        <button id="library-create-program" class="btn btn-ghost" type="button">Créer un nouveau programme</button>
        <button id="library-refresh" class="btn btn-ghost icon-btn" type="button" title="Rafraichir la liste" aria-label="Rafraichir la liste">
          <span class="icon-glyph" aria-hidden="true">&#x21bb;</span><span class="sr-only">Rafraichir la liste</span>
        </button>
        <button id="library-new-folder" class="btn icon-btn" type="button" title="Nouveau dossier" aria-label="Nouveau dossier">
          <span class="icon-glyph" aria-hidden="true">&#x1f4c1;+</span><span class="sr-only">Nouveau dossier</span>
        </button>
        <button id="library-download-program" class="btn btn-ghost icon-btn" type="button" title="Télécharger le programme" aria-label="Télécharger le programme" disabled>
          <span class="icon-glyph" aria-hidden="true">&#x1f4e5;</span><span class="sr-only">Télécharger le programme</span>
        </button>
        <button id="library-delete" class="btn btn-danger icon-btn" type="button" title="Supprimer le fichier selectionne" aria-label="Supprimer le fichier selectionne" disabled>
          <span class="icon-glyph" aria-hidden="true">&#x1f5d1;</span><span class="sr-only">Supprimer le fichier selectionne</span>
        </button>
        <span id="library-count" class="library-count">0 fichier</span>
      </div>
    </div>
    
  </div>

  <div class="explorer-list-wrap">
    <table class="explorer-table" aria-describedby="library-status">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Paroisse</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="library-body">
        <tr>
          <td colspan="3" class="empty-cell">Chargement de la bibliotheque...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p id="library-status" class="hint" role="status">En attente de chargement.</p>

  <div id="messe-popup" class="messe-popup" aria-hidden="true">
    <div class="messe-popup-backdrop" data-close="true"></div>
    <div class="messe-popup-dialog" role="dialog" aria-modal="true" aria-labelledby="messe-popup-title">
      <button id="messe-popup-close" class="messe-popup-close" type="button" aria-label="Fermer">×</button>
      <h2 id="messe-popup-title">Informations de la messe</h2>
      <div id="messe-popup-content" class="messe-popup-content"></div>
    </div>
  </div>

  <style>
    .messe-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .messe-popup.is-open {
      display: flex;
    }

    .messe-popup-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
    }

    .messe-popup-dialog {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      max-height: min(80vh, 760px);
      overflow: auto;
      background: #ffffff;
      color: #0f172a;
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.28);
      padding: 28px 28px 22px;
    }

    .messe-popup-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: 0;
      background: #f1f5f9;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      color: #0f172a;
    }

    .messe-popup-content h3 {
      margin: 18px 0 8px;
      font-size: 0.98rem;
      color: #0f766e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .messe-popup-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .messe-popup-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .messe-popup-card strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 4px;
    }

    .messe-popup-description {
      white-space: pre-wrap;
      line-height: 1.6;
      margin: 0;
      color: #334155;
    }

    .messe-popup-list {
      margin: 0;
      padding-left: 18px;
      color: #334155;
      line-height: 1.6;
    }

    .messe-popup-empty {
      color: #64748b;
      margin: 0;
    }
  </style>

  <script>
    (function () {
      const popup = document.getElementById('messe-popup');
      const closeButton = document.getElementById('messe-popup-close');
      const title = document.getElementById('messe-popup-title');
      const content = document.getElementById('messe-popup-content');
      const popupBackdrop = popup.querySelector('.messe-popup-backdrop');

      function formatDisplayValue(value) {
        return String(value || '').trim() || '—';
      }

      function parseFileMetadata(fileName) {
        const rawName = String(fileName || '').replace(/\.[^/.]+$/, '');
        const parts = rawName.split('_').map((part) => part.trim()).filter(Boolean);

        const metadata = {
          name: fileName,
          date: '',
          lieu: '',
          occasion: '',
        };

        if (parts.length >= 3) {
          metadata.date = parts[0];
          metadata.lieu = parts.slice(1, -1).join(' ');
          metadata.occasion = parts[parts.length - 1];
        } else if (parts.length === 2) {
          metadata.date = parts[0];
          metadata.lieu = parts[1];
        } else if (parts.length === 1) {
          metadata.date = parts[0];
        }

        return metadata;
      }

      function extractTextValue(text, key) {
        const prefix = `${key} =`;
        for (const line of text.split(/\r?\n/)) {
          const normalized = line.trim();
          if (normalized.startsWith(prefix)) {
            return normalized.slice(prefix.length).trim();
          }
        }
        return '';
      }

      function parseProgramText(text) {
        const lines = String(text || '').split(/\r?\n/);
        const metadata = {
          date: '',
          lieu: '',
          occasion: '',
          description: '',
          sections: [],
          chants: [],
        };

        const headerLine = lines.find((line) => line.includes('£'));
        if (headerLine) {
          const match = headerLine.match(/^(\d{4}-\d{2}-\d{2})£([^£]+)£([^£]+)$/);
          if (match) {
            metadata.date = match[1];
            metadata.lieu = match[2].trim();
            metadata.occasion = match[3].trim();
          }
        }

        const description = extractTextValue(String(text || ''), 'description');
        if (description) {
          metadata.description = description;
        }

        for (const line of lines) {
          const cleaned = line.trim();
          if (!cleaned) {
            continue;
          }

          const sectionMatch = cleaned.match(/^\[(.+)\]$/);
          if (sectionMatch) {
            metadata.sections.push(sectionMatch[1].trim());
          }

          if (cleaned.startsWith('#')) {
            metadata.chants.push(cleaned.slice(1).trim());
          }
        }

        return metadata;
      }

      async function fetchProgramText(filePath) {
        const encoded = filePath
          .split('/')
          .filter(Boolean)
          .map((part) => encodeURIComponent(part))
          .join('/');

        const fileUrl = `${window.WEBAPP_CONFIG?.PDF_ROOT || './'}${encoded}`;
        const response = await fetch(fileUrl, { credentials: 'include' });
        if (!response.ok) {
          throw new Error(`Impossibile de lire ${filePath}.`);
        }
        return response.text();
      }

      function renderPopup(data) {
        title.textContent = data.title || 'Informations de la messe';

        const date = formatDisplayValue(data.date);
        const lieu = formatDisplayValue(data.lieu);
        const occasion = formatDisplayValue(data.occasion);
        const description = formatDisplayValue(data.description);
        const filePath = formatDisplayValue(data.path);

        const listItems = (data.chants || []).length
          ? (data.chants || []).map((chant) => `<li>${chant}</li>`).join('')
          : '<li>Aucun chant liste dans le programme.</li>';

        content.innerHTML = `
          <div class="messe-popup-info-grid">
            <div class="messe-popup-card">
              <strong>Nom</strong>
              <span>${formatDisplayValue(data.name)}</span>
            </div>
            <div class="messe-popup-card">
              <strong>Date</strong>
              <span>${date}</span>
            </div>
            <div class="messe-popup-card">
              <strong>Lieu</strong>
              <span>${lieu}</span>
            </div>
            <div class="messe-popup-card">
              <strong>Occasion</strong>
              <span>${occasion}</span>
            </div>
            <div class="messe-popup-card">
              <strong>Fichier</strong>
              <span>${filePath}</span>
            </div>
          </div>

          <h3>Description</h3>
          <p class="messe-popup-description">${description}</p>

          <h3>Sections</h3>
          <p class="messe-popup-description">${(data.sections || []).length ? data.sections.join(' • ') : 'Aucune section repertoriee.'}</p>

          <h3>Chants</h3>
          <ul class="messe-popup-list">${listItems}</ul>
        `;
      }

      window.openMessePopupFromLibrary = function (file) {
        const filePath = file && file.path ? file.path : '';
        const fileName = file && file.name ? file.name : '';
        if (!filePath || !fileName) {
          return;
        }
        openMessePopup(filePath, fileName);
      };

      function openMessePopup(filePath, fileName) {
        const fileInfo = parseFileMetadata(fileName);
        const baseInfo = {
          title: fileInfo.occasion ? `${fileInfo.date || 'Messe'} - ${fileInfo.occasion}` : (fileInfo.name || 'Messe'),
          name: fileName,
          path: filePath,
          date: fileInfo.date,
          lieu: fileInfo.lieu,
          occasion: fileInfo.occasion,
          description: '',
          sections: [],
          chants: [],
        };

        renderPopup(baseInfo);

        fetchProgramText(filePath)
          .then((text) => {
            const parsed = parseProgramText(text);
            renderPopup({
              ...baseInfo,
              date: parsed.date || baseInfo.date,
              lieu: parsed.lieu || baseInfo.lieu,
              occasion: parsed.occasion || baseInfo.occasion,
              description: parsed.description,
              sections: parsed.sections,
              chants: parsed.chants,
            });
          })
          .catch(() => {
            renderPopup(baseInfo);
          });

        popup.classList.add('is-open');
        popup.setAttribute('aria-hidden', 'false');
      }

      function closeMessePopup() {
        popup.classList.remove('is-open');
        popup.setAttribute('aria-hidden', 'true');
      }

      closeButton.addEventListener('click', closeMessePopup);
      popupBackdrop.addEventListener('click', closeMessePopup);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && popup.classList.contains('is-open')) {
          closeMessePopup();
        }
      });

      document.addEventListener('click', (event) => {
        const row = event.target.closest('tr[data-program-path]');
        if (!row) {
          return;
        }

        const filePath = row.dataset.programPath;
        const fileName = row.dataset.programName || row.dataset.programTitle || '';
        if (!filePath) {
          return;
        }

        if (event.target.closest('a')) {
          return;
        }

        openMessePopup(filePath, fileName);
      });
    })();
  </script>

  <script src="./library.js"></script>
</body>
</html>
