<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informations du chant</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .chant-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .chant-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .chant-layout.is-preview-visible {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .chant-layout.is-preview-visible .chant-page {
      max-width: none;
    }

    .chant-preview {
      display: none;
      flex-direction: column;
      position: sticky;
      top: 16px;
      height: calc(100vh - 32px);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .chant-layout.is-preview-visible .chant-preview {
      display: flex;
    }

    .chant-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chant-preview-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .chant-preview-frame {
      flex: 1;
      width: 100%;
      border: 0;
      border-radius: 10px;
    }

    .chant-title {
      margin: 0 0 4px;
      font-size: clamp(1.4rem, 2vw, 1.9rem);
    }

    .chant-subtitle {
      margin: 0 0 20px;
      color: var(--ink-soft);
    }

    .chant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .chant-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
    }

    .chant-card strong {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .chant-section {
      margin-top: 24px;
    }

    .chant-section h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 12px;
    }

    .chant-description {
      white-space: pre-wrap;
      margin: 0;
    }

    .chant-files {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .chant-files th,
    .chant-files td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .chant-file-link {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: #0f766e;
      font-weight: 600;
      cursor: pointer;
    }

    .chant-file-link:hover {
      text-decoration: underline;
    }

    .chant-audio-list {
      display: grid;
      gap: 8px;
    }

    .chant-audio-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
    }

    .chant-audio-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chant-audio-name {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .audio-play-button {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #ffffff;
      color: #0f766e;
      font: inherit;
      cursor: pointer;
    }

    .audio-play-button:hover {
      background: #ccfbf1;
    }

    .audio-progress {
      width: 100%;
      accent-color: #0f766e;
    }

    .audio-progress:disabled {
      opacity: 0.5;
    }

    .chant-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chant-dialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
    }

    .chant-dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      min-width: min(460px, 92vw);
      color: var(--ink);
    }

    .chant-dialog h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .chant-form-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .chant-form-grid label {
      display: grid;
      gap: 4px;
      font-size: 0.9em;
    }

    .chant-form-grid input,
    .chant-form-grid textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .chant-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .auteur-picker {
      position: relative;
    }

    .auteur-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .auteur-chips:empty {
      margin-bottom: 0;
    }

    .auteur-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      background: #ccfbf1;
      color: var(--ink);
      font-size: 0.85em;
    }

    .auteur-chip-remove {
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
      line-height: 1;
      color: inherit;
      opacity: 0.7;
      padding: 2px 4px;
    }

    .auteur-chip-remove:hover {
      opacity: 1;
    }

    .auteur-suggestions-list {
      position: absolute;
      z-index: 5;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .auteur-suggestions-list[hidden] {
      display: none;
    }

    .auteur-suggestion-item {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border: none;
      background: none;
      text-align: left;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
    }

    .auteur-suggestion-item:hover,
    .auteur-suggestion-item:focus {
      background: #ccfbf1;
    }

    .auteur-suggestion-item.is-add-new {
      color: #0f766e;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="chant-layout" class="chant-layout">
    <main class="chant-page">
    <h1 id="chant-title" class="chant-title">Informations du chant</h1>
    <p id="chant-subtitle" class="chant-subtitle"></p>
    <div class="chant-actions">
      <button id="edit-chant" class="btn" type="button" disabled>Modifier le chant</button>
    </div>
    <div id="chant-content">
      <p class="hint" role="status">Chargement des informations...</p>
    </div>
    <audio id="chant-audio-player" hidden></audio>
    </main>

    <aside id="chant-preview" class="chant-preview" aria-label="Apercu du fichier">
      <div class="chant-preview-head">
        <h2 id="preview-title">Apercu</h2>
        <div style="display: flex; gap: 8px;">
          <button id="preview-external" class="btn btn-ghost" type="button">Nouvel onglet</button>
          <button id="preview-close" class="btn btn-ghost" type="button">Fermer</button>
        </div>
      </div>
      <iframe id="preview-frame" class="chant-preview-frame" title="Apercu du fichier"></iframe>
    </aside>
  </div>

  <dialog id="chant-dialog" class="chant-dialog">
    <form id="chant-form" method="dialog">
      <h2>Modifier le chant</h2>
      <div class="chant-form-grid">
        <label>Nom
          <input type="text" name="nom" maxlength="255" required />
        </label>
        <label>Dossier (Path)
          <input type="text" name="path" maxlength="500" pattern="[^/\\]*" title="Un seul nom de dossier, sans /" />
        </label>
        <label>Cote
          <input type="text" name="cote" maxlength="20" />
        </label>
        <label>Auteurs
          <div class="auteur-picker" id="auteur-picker">
            <div class="auteur-chips" id="auteur-chips"></div>
            <input type="text" id="auteur-search" placeholder="Rechercher un auteur existant ou en saisir un nouveau" autocomplete="off" />
            <div class="auteur-suggestions-list" id="auteur-suggestions-list" hidden></div>
          </div>
          <input type="hidden" name="auteurs" id="auteurs-hidden" />
        </label>
        <label>Categories
          <div class="auteur-picker" id="categorie-picker">
            <div class="auteur-chips" id="categorie-chips"></div>
            <input type="text" id="categorie-search" placeholder="Rechercher une categorie existante ou en saisir une nouvelle" autocomplete="off" />
            <div class="auteur-suggestions-list" id="categorie-suggestions-list" hidden></div>
          </div>
          <input type="hidden" name="categories" id="categories-hidden" />
        </label>
        <label>Temps liturgiques
          <div class="auteur-picker" id="temps-liturgique-picker">
            <div class="auteur-chips" id="temps-liturgique-chips"></div>
            <input type="text" id="temps-liturgique-search" placeholder="Rechercher un temps liturgique existant ou en saisir un nouveau" autocomplete="off" />
            <div class="auteur-suggestions-list" id="temps-liturgique-suggestions-list" hidden></div>
          </div>
          <input type="hidden" name="temps_liturgiques" id="temps-liturgiques-hidden" />
        </label>
        <label>Informations
          <textarea name="informations" rows="4" maxlength="5000"></textarea>
        </label>
      </div>
      <div class="chant-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="file-dialog" class="chant-dialog">
    <form id="file-form" method="dialog">
      <h2>Modifier le fichier</h2>
      <div class="chant-form-grid">
        <label>Nom du fichier
          <input type="text" name="nom_fichier" maxlength="255" required />
        </label>
        <label>Tonalite
          <input type="text" name="tonalite" maxlength="16" />
        </label>
        <label>Nombre de voix
          <input type="number" name="nb_voix" min="0" max="32" step="1" />
        </label>
        <label>
          <span><input type="checkbox" name="accords" /> Accords</span>
        </label>
        <label>Informations
          <textarea name="informations" rows="3" maxlength="5000"></textarea>
        </label>
      </div>
      <div class="chant-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="move-dialog" class="chant-dialog">
    <form id="move-form" method="dialog">
      <h2>Deplacer le fichier</h2>
      <div class="chant-form-grid">
        <label>Rechercher un chant
          <input id="move-search" type="search" autocomplete="off" placeholder="Nom du chant ou dossier" />
        </label>
        <label>Chant de destination
          <select name="chant_id" size="8" required></select>
        </label>
      </div>
      <div class="chant-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Deplacer</button>
      </div>
    </form>
  </dialog>

  <script>
    const WEBAPP_CONFIG = window.WEBAPP_CONFIG || {};
    const BASE_URL = WEBAPP_CONFIG.BASE_URL || '';
    const DATA_API = WEBAPP_CONFIG.DATA_API || `${BASE_URL}webapp/api/data.php`;
    const LOCAL_DATA_API = './api/data.php';
    const requestedFileName = new URLSearchParams(window.location.search).get('file') || '';
    const PDF_ROOT = WEBAPP_CONFIG.PDF_ROOT || `${BASE_URL}pdf/`;

    function isAudioFileName(fileName) {
      return /\.(mp3|m4a|wav)$/i.test(String(fileName || ''));
    }

    function buildPdfFileUrl(relativePdfPath) {
      return `${PDF_ROOT}${String(relativePdfPath || '')
        .split('/')
        .filter(Boolean)
        .map((segment) => encodeURIComponent(segment))
        .join('/')}`;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      }[character]));
    }

    function formatValue(value) {
      return escapeHtml(String(value === null || value === undefined ? '' : value).trim() || '—');
    }

    function formatDate(value) {
      if (!value) {
        return '—';
      }
      const date = new Date(String(value).replace(' ', 'T'));
      return Number.isNaN(date.getTime()) ? escapeHtml(value) : date.toLocaleString('fr-FR');
    }

    function formatDay(value) {
      if (!value) {
        return '—';
      }
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? escapeHtml(value) : date.toLocaleDateString('fr-FR');
    }

    function redirectToLogin() {
      const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
      window.location.replace(`./login.html?return=${returnUrl}`);
    }

    async function fetchChant(chantId) {
      const endpoints = [LOCAL_DATA_API, DATA_API];
      const errors = [];

      for (let index = 0; index < endpoints.length; index += 1) {
        const baseUrl = endpoints[index];
        const isLast = index === endpoints.length - 1;
        const query = new URLSearchParams({ action: 'chant_detail', id: chantId }).toString();

        try {
          const response = await fetch(`${baseUrl}?${query}`, { credentials: 'include' });

          if (response.status === 401) {
            redirectToLogin();
            return null;
          }

          const payload = await response.json().catch(() => null);

          if (!response.ok) {
            if (!isLast && (response.status === 404 || response.status >= 500)) {
              errors.push(`HTTP ${response.status} on ${baseUrl}`);
              continue;
            }
            throw new Error((payload && payload.message) || `HTTP ${response.status}`);
          }

          if (!payload || !payload.success) {
            throw new Error((payload && payload.message) || 'Erreur API');
          }

          return payload;
        } catch (error) {
          if (!isLast) {
            errors.push(`${baseUrl}: ${error.message}`);
            continue;
          }
          throw error;
        }
      }

      throw new Error(errors.join(' | ') || 'API inaccessible');
    }

    let previewUrl = '';

    function openFile(chant, file) {
      const path = [chant.path, chant.nom, file.nomFichier].filter(Boolean).join('/');

      if (isAudioFileName(file.nomFichier)) {
        window.open(buildPdfFileUrl(path), '_blank', 'noopener,noreferrer');
        return;
      }

      previewUrl = `./visualisation.html?lien=${encodeURIComponent(`/${path}`)}`;

      document.getElementById('preview-title').textContent = file.nomFichier;
      document.getElementById('preview-frame').src = previewUrl;
      document.getElementById('chant-layout').classList.add('is-preview-visible');
    }

    const audioPlayer = document.getElementById('chant-audio-player');
    let activeAudioButton = null;

    function resetAudioButton() {
      if (activeAudioButton) {
        activeAudioButton.innerHTML = '&#9658;';
        const progress = document.querySelector(`[data-audio-progress="${activeAudioButton.dataset.audioId}"]`);
        if (progress) {
          progress.value = 0;
          progress.disabled = true;
        }
        activeAudioButton = null;
      }
    }

    audioPlayer.addEventListener('pause', resetAudioButton);
    audioPlayer.addEventListener('ended', resetAudioButton);
    audioPlayer.addEventListener('timeupdate', () => {
      if (!activeAudioButton || !audioPlayer.duration) {
        return;
      }
      const progress = document.querySelector(`[data-audio-progress="${activeAudioButton.dataset.audioId}"]`);
      if (progress) {
        progress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      }
    });

    function toggleAudioPlayback(chant, file, button) {
      if (activeAudioButton === button) {
        audioPlayer.pause();
        return;
      }

      resetAudioButton();

      const path = [chant.path, chant.nom, file.nomFichier].filter(Boolean).join('/');
      audioPlayer.src = buildPdfFileUrl(path);
      audioPlayer.play().catch(() => resetAudioButton());

      activeAudioButton = button;
      button.innerHTML = '&#9208;';

      const progress = document.querySelector(`[data-audio-progress="${file.id}"]`);
      if (progress) {
        progress.value = 0;
        progress.disabled = false;
      }
    }

    function closePreview() {
      previewUrl = '';
      document.getElementById('preview-frame').src = 'about:blank';
      document.getElementById('chant-layout').classList.remove('is-preview-visible');
    }

    function openPreviewExternally() {
      if (!previewUrl) {
        return;
      }

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'openPageTab',
          item: {
            key: `visualisation-${previewUrl}`,
            name: document.getElementById('preview-title').textContent,
            title: document.getElementById('preview-title').textContent,
            description: 'Visualisation',
            url: previewUrl,
          },
        }, '*');
        return;
      }

      window.open(previewUrl, '_blank', 'noopener,noreferrer');
    }

    document.getElementById('preview-close').addEventListener('click', closePreview);
    document.getElementById('preview-external').addEventListener('click', openPreviewExternally);

    function openProgramme(programmeId) {
      const url = `./informations.html?programmeId=${encodeURIComponent(programmeId)}`;

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'openMesseInfoModal', item: { url, title: 'Informations de la messe' } }, '*');
        return;
      }

      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function postData(action, payload) {
      const endpoints = [LOCAL_DATA_API, DATA_API];
      const errors = [];

      for (let index = 0; index < endpoints.length; index += 1) {
        const baseUrl = endpoints[index];
        const isLast = index === endpoints.length - 1;

        try {
          const body = new FormData();
          body.append('action', action);
          Object.entries(payload).forEach(([key, value]) => {
            body.append(key, value);
          });

          const response = await fetch(baseUrl, { method: 'POST', body, credentials: 'include' });
          const result = await response.json().catch(() => null);

          if (!response.ok) {
            if (!isLast && (response.status === 404 || response.status >= 500)) {
              errors.push(`HTTP ${response.status} on ${baseUrl}`);
              continue;
            }
            throw new Error((result && result.message) || `HTTP ${response.status}`);
          }

          if (!result || !result.success) {
            throw new Error((result && result.message) || 'Erreur API');
          }

          return result;
        } catch (error) {
          if (!isLast) {
            errors.push(`${baseUrl}: ${error.message}`);
            continue;
          }
          throw error;
        }
      }

      throw new Error(errors.join(' | ') || 'API inaccessible');
    }

    const auteurChips = document.getElementById('auteur-chips');
    const auteurSearchInput = document.getElementById('auteur-search');
    const auteurSuggestionsList = document.getElementById('auteur-suggestions-list');
    const auteursHiddenInput = document.getElementById('auteurs-hidden');
    const categorieChips = document.getElementById('categorie-chips');
    const categorieSearchInput = document.getElementById('categorie-search');
    const categorieSuggestionsList = document.getElementById('categorie-suggestions-list');
    const categoriesHiddenInput = document.getElementById('categories-hidden');
    const tempsLiturgiqueChips = document.getElementById('temps-liturgique-chips');
    const tempsLiturgiqueSearchInput = document.getElementById('temps-liturgique-search');
    const tempsLiturgiqueSuggestionsList = document.getElementById('temps-liturgique-suggestions-list');
    const tempsLiturgiquesHiddenInput = document.getElementById('temps-liturgiques-hidden');

    /**
     * Builds a chip-based picker (search existing values or add a new one) backed
     * by a hidden comma-separated input, shared by the Auteurs and Categories fields.
     */
    function createTagPicker({ chipsEl, searchInput: input, suggestionsList, hiddenInput, apiAction, apiKey, addLabel }) {
      let allOptions = [];
      let selected = [];

      function syncHidden() {
        hiddenInput.value = selected.join(', ');
      }

      function render() {
        chipsEl.innerHTML = '';
        selected.forEach((nom) => {
          const chip = document.createElement('span');
          chip.className = 'auteur-chip';

          const label = document.createElement('span');
          label.textContent = nom;
          chip.appendChild(label);

          const removeButton = document.createElement('button');
          removeButton.type = 'button';
          removeButton.className = 'auteur-chip-remove';
          removeButton.textContent = '\u00d7';
          removeButton.setAttribute('aria-label', `Retirer ${nom}`);
          removeButton.addEventListener('click', () => remove(nom));
          chip.appendChild(removeButton);

          chipsEl.appendChild(chip);
        });
        syncHidden();
      }

      function add(nom) {
        const trimmed = nom.trim();
        if (!trimmed) {
          return;
        }
        const alreadySelected = selected.some((existing) => existing.toLowerCase() === trimmed.toLowerCase());
        if (!alreadySelected) {
          selected.push(trimmed);
          render();
        }
        input.value = '';
        hideSuggestions();
        input.focus();
      }

      function remove(nom) {
        selected = selected.filter((existing) => existing !== nom);
        render();
      }

      function hideSuggestions() {
        suggestionsList.hidden = true;
        suggestionsList.innerHTML = '';
      }

      function renderSuggestions() {
        const filter = input.value.trim().toLowerCase();
        const matches = allOptions.filter((option) => {
          const nom = option.nom.toLowerCase();
          const isSelected = selected.some((existing) => existing.toLowerCase() === nom);
          return !isSelected && (!filter || nom.includes(filter));
        });

        suggestionsList.innerHTML = '';

        matches.forEach((option) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'auteur-suggestion-item';
          item.textContent = option.nom;
          item.addEventListener('click', () => add(option.nom));
          suggestionsList.appendChild(item);
        });

        const filterValue = input.value.trim();
        const isExactMatch = allOptions.some((option) => option.nom.toLowerCase() === filterValue.toLowerCase());
        if (filterValue && !isExactMatch) {
          const addItem = document.createElement('button');
          addItem.type = 'button';
          addItem.className = 'auteur-suggestion-item is-add-new';
          addItem.textContent = `Ajouter "${filterValue}" ${addLabel}`;
          addItem.addEventListener('click', () => add(filterValue));
          suggestionsList.appendChild(addItem);
        }

        suggestionsList.hidden = suggestionsList.children.length === 0;
      }

      input.addEventListener('input', renderSuggestions);
      input.addEventListener('focus', renderSuggestions);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          const firstSuggestion = suggestionsList.querySelector('.auteur-suggestion-item');
          if (firstSuggestion) {
            firstSuggestion.click();
          } else if (input.value.trim()) {
            add(input.value.trim());
          }
        } else if (event.key === 'Escape') {
          hideSuggestions();
        }
      });

      document.addEventListener('click', (event) => {
        if (!chipsEl.parentElement.contains(event.target)) {
          hideSuggestions();
        }
      });

      return {
        setSelected(values) {
          selected = Array.isArray(values) ? [...values] : [];
          input.value = '';
          render();
          hideSuggestions();
        },
        async loadOptions() {
          try {
            const response = await fetch(`${LOCAL_DATA_API}?action=${apiAction}`, { credentials: 'include' });
            const payload = await response.json().catch(() => null);
            allOptions = (payload && payload[apiKey]) || [];
          } catch {
            // Suggestions are optional.
          }
        },
      };
    }

    const auteurPicker = createTagPicker({
      chipsEl: auteurChips,
      searchInput: auteurSearchInput,
      suggestionsList: auteurSuggestionsList,
      hiddenInput: auteursHiddenInput,
      apiAction: 'auteurs',
      apiKey: 'auteurs',
      addLabel: 'comme nouvel auteur',
    });

    const categoriePicker = createTagPicker({
      chipsEl: categorieChips,
      searchInput: categorieSearchInput,
      suggestionsList: categorieSuggestionsList,
      hiddenInput: categoriesHiddenInput,
      apiAction: 'categories',
      apiKey: 'categories',
      addLabel: 'comme nouvelle categorie',
    });

    const tempsLiturgiquePicker = createTagPicker({
      chipsEl: tempsLiturgiqueChips,
      searchInput: tempsLiturgiqueSearchInput,
      suggestionsList: tempsLiturgiqueSuggestionsList,
      hiddenInput: tempsLiturgiquesHiddenInput,
      apiAction: 'temps_liturgiques',
      apiKey: 'tempsLiturgiques',
      addLabel: 'comme nouveau temps liturgique',
    });

    function render(chant, files, programmes) {
      document.getElementById('chant-title').textContent = chant.nom;
      document.getElementById('chant-subtitle').textContent = chant.path ? `Dossier : ${chant.path}` : 'A la racine';

      const filesRows = files.map((file) => `
        <tr>
          <td><button type="button" class="chant-file-link" data-file-id="${file.id}">${escapeHtml(file.nomFichier)}</button></td>
          <td>${formatValue(file.tonalite)}</td>
          <td>${file.accords ? 'Oui' : 'Non'}</td>
          <td>${file.nbVoix === null ? '—' : escapeHtml(String(file.nbVoix))}</td>
          <td>${formatDate(file.dateAjout)}</td>
          <td>${formatValue(file.informations)}</td>
          <td>
            <button type="button" class="btn btn-ghost" data-file-edit="${file.id}">Modifier</button>
            <button type="button" class="btn btn-ghost" data-file-move="${file.id}">Deplacer</button>
            <button type="button" class="btn btn-danger" data-file-delete="${file.id}">Supprimer</button>
          </td>
        </tr>
      `).join('');

      const programmesRows = programmes.map((programme) => `
        <tr>
          <td><button type="button" class="chant-file-link" data-programme-id="${programme.id}">${formatDay(programme.date)}</button></td>
          <td>${formatValue(programme.partie)}</td>
          <td>${formatValue(programme.lieu)}</td>
          <td>${formatValue(programme.occasion)}</td>
          <td>${formatValue(programme.paroisse)}</td>
        </tr>
      `).join('');

      const audioFiles = files.filter((file) => isAudioFileName(file.nomFichier));
      const audioItems = audioFiles.map((file) => `
        <div class="chant-audio-item">
          <div class="chant-audio-row">
            <button type="button" class="audio-play-button" data-audio-id="${file.id}" aria-label="Lire ${escapeHtml(file.nomFichier)}">&#9658;</button>
            <span class="chant-audio-name">${escapeHtml(file.nomFichier)}</span>
          </div>
          <input type="range" class="audio-progress" data-audio-progress="${file.id}" min="0" max="100" step="0.1" value="0" disabled aria-label="Progression de ${escapeHtml(file.nomFichier)}" />
        </div>
      `).join('');

      document.getElementById('chant-content').innerHTML = `
        <div class="chant-grid">
          <div class="chant-card"><strong>Nom</strong><span>${formatValue(chant.nom)}</span></div>
          <div class="chant-card"><strong>Dossier</strong><span>${formatValue(chant.path)}</span></div>
          <div class="chant-card"><strong>Auteurs</strong><span>${formatValue(chant.auteurs)}</span></div>
          <div class="chant-card"><strong>Categories</strong><span>${formatValue(chant.categories)}</span></div>
          <div class="chant-card"><strong>Temps liturgiques</strong><span>${formatValue(chant.tempsLiturgiques)}</span></div>
          <div class="chant-card"><strong>Cote</strong><span>${chant.cote === null ? '—' : escapeHtml(String(chant.cote))}</span></div>
          <div class="chant-card"><strong>Date d'ajout</strong><span>${formatDate(chant.dateAjout)}</span></div>
          <div class="chant-card"><strong>Fichiers</strong><span>${chant.fileCount}</span></div>
        </div>

        <section class="chant-section">
          <h2>Informations</h2>
          <p class="chant-description">${formatValue(chant.informations)}</p>
        </section>

        ${audioFiles.length ? `
        <section class="chant-section">
          <h2>Audio</h2>
          <div class="chant-audio-list">${audioItems}</div>
        </section>
        ` : ''}

        <section class="chant-section">
          <h2>Fichiers associés</h2>
          ${files.length ? `
            <table class="chant-files">
              <thead>
                <tr>
                  <th>Nom du fichier</th>
                  <th>Tonalite</th>
                  <th>Accords</th>
                  <th>Nb voix</th>
                  <th>Date d'ajout</th>
                  <th>Informations</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>${filesRows}</tbody>
            </table>
          ` : '<p class="hint">Aucun fichier lie a ce chant.</p>'}
        </section>
        <section class="chant-section">
          <h2>Chant utilisé dans les programmes</h2>
          ${programmes.length ? `
            <table class="chant-files">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Partie</th>
                  <th>Lieu</th>
                  <th>Occasion</th>
                  <th>Paroisse</th>
                </tr>
              </thead>
              <tbody>${programmesRows}</tbody>
            </table>
          ` : '<p class="hint">Ce chant n\'est utilise dans aucun programme.</p>'}
        </section>
      `;

      document.querySelectorAll('[data-file-id]').forEach((button) => {
        const file = files.find((item) => String(item.id) === button.dataset.fileId);
        button.addEventListener('click', () => openFile(chant, file));
      });

      document.querySelectorAll('[data-audio-id]').forEach((button) => {
        const file = files.find((item) => String(item.id) === button.dataset.audioId);
        button.addEventListener('click', () => toggleAudioPlayback(chant, file, button));
      });

      document.querySelectorAll('[data-audio-progress]').forEach((input) => {
        input.addEventListener('input', () => {
          if (activeAudioButton && activeAudioButton.dataset.audioId === input.dataset.audioProgress && audioPlayer.duration) {
            audioPlayer.currentTime = (Number(input.value) / 100) * audioPlayer.duration;
          }
        });
      });

      document.querySelectorAll('[data-programme-id]').forEach((button) => {
        button.addEventListener('click', () => openProgramme(button.dataset.programmeId));
      });

      document.querySelectorAll('[data-file-edit]').forEach((button) => {
        const file = files.find((item) => String(item.id) === button.dataset.fileEdit);
        button.addEventListener('click', () => openFileDialog(file));
      });

      document.querySelectorAll('[data-file-move]').forEach((button) => {
        button.addEventListener('click', () => openMoveDialog(Number(button.dataset.fileMove)));
      });

      document.querySelectorAll('[data-file-delete]').forEach((button) => {
        const file = files.find((item) => String(item.id) === button.dataset.fileDelete);
        button.addEventListener('click', () => deleteFile(file));
      });

      const firstPdf = files.find((file) => /\.pdf$/i.test(String(file.nomFichier || '')));
      const requestedFile = requestedFileName
        ? files.find((file) => String(file.nomFichier || '').toLowerCase() === requestedFileName.toLowerCase())
        : null;
      const fileToOpen = requestedFile || firstPdf;
      if (fileToOpen) {
        openFile(chant, fileToOpen);
      }
    }

    let reloadChant = async () => {};
    let moveOptions = [];
    let movingFileId = null;

    function openFileDialog(file) {
      const form = document.getElementById('file-form');
      form.dataset.fileId = String(file.id);
      form.elements.nom_fichier.value = file.nomFichier;
      form.elements.tonalite.value = file.tonalite || '';
      form.elements.nb_voix.value = file.nbVoix === null ? '' : String(file.nbVoix);
      form.elements.accords.checked = Boolean(file.accords);
      form.elements.informations.value = file.informations || '';
      document.getElementById('file-dialog').showModal();
    }

    function renderMoveOptions() {
      const select = document.getElementById('move-form').elements.chant_id;
      const filter = document.getElementById('move-search').value.trim().toLowerCase();
      select.innerHTML = '';

      moveOptions
        .filter((option) => !filter || `${option.path} ${option.nom}`.toLowerCase().includes(filter))
        .forEach((option) => {
          const element = document.createElement('option');
          element.value = String(option.id);
          element.textContent = option.path ? `${option.path} / ${option.nom}` : option.nom;
          select.appendChild(element);
        });
    }

    async function openMoveDialog(fileId) {
      movingFileId = fileId;
      document.getElementById('move-search').value = '';

      try {
        const response = await fetch(`${LOCAL_DATA_API}?action=chant_options`, { credentials: 'include' });
        const payload = await response.json().catch(() => null);

        if (!response.ok || !payload || !payload.success) {
          throw new Error((payload && payload.message) || `HTTP ${response.status}`);
        }

        moveOptions = payload.chants || [];
        renderMoveOptions();
        document.getElementById('move-dialog').showModal();
      } catch (error) {
        window.alert(error.message);
      }
    }

    async function deleteFile(file) {
      if (!window.confirm(`Supprimer le fichier "${file.nomFichier}" ?`)) {
        return;
      }

      try {
        await postData('file_delete', { id: file.id });
        await reloadChant();
      } catch (error) {
        window.alert(error.message);
      }
    }

    (async () => {
      const chantId = new URLSearchParams(window.location.search).get('chantId') || '';

      if (!chantId) {
        document.getElementById('chant-content').innerHTML = '<p class="hint is-error">Aucun chant selectionne.</p>';
        return;
      }

      const dialog = document.getElementById('chant-dialog');
      const form = document.getElementById('chant-form');
      const editButton = document.getElementById('edit-chant');

      async function reload() {
        const payload = await fetchChant(chantId);
        if (!payload) {
          return null;
        }
        render(payload.chant, payload.files || [], payload.programmes || []);
        editButton.disabled = false;
        return payload.chant;
      }

      let currentChant = null;

      editButton.addEventListener('click', () => {
        if (!currentChant) {
          return;
        }
        form.elements.nom.value = currentChant.nom;
        form.elements.path.value = currentChant.path;
        form.elements.cote.value = currentChant.cote === null ? '' : String(currentChant.cote);
        form.elements.informations.value = currentChant.informations || '';
        auteurPicker.setSelected(currentChant.auteurs
          ? currentChant.auteurs.split(',').map((nom) => nom.trim()).filter(Boolean)
          : []);
        auteurPicker.loadOptions();
        categoriePicker.setSelected(currentChant.categories
          ? currentChant.categories.split(',').map((nom) => nom.trim()).filter(Boolean)
          : []);
        categoriePicker.loadOptions();
        tempsLiturgiquePicker.setSelected(currentChant.tempsLiturgiques
          ? currentChant.tempsLiturgiques.split(',').map((nom) => nom.trim()).filter(Boolean)
          : []);
        tempsLiturgiquePicker.loadOptions();
        dialog.showModal();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        try {
          await postData('chant_save', {
            id: chantId,
            nom: form.elements.nom.value.trim(),
            path: form.elements.path.value.trim(),
            cote: form.elements.cote.value.trim(),
            auteurs: form.elements.auteurs.value.trim(),
            categories: form.elements.categories.value.trim(),
            temps_liturgiques: form.elements.temps_liturgiques.value.trim(),
            informations: form.elements.informations.value.trim(),
          });
          dialog.close();
          currentChant = await reload();
        } catch (error) {
          window.alert(error.message);
        }
      });

      dialog.querySelectorAll('[data-close-dialog]').forEach((button) => {
        button.addEventListener('click', () => dialog.close());
      });

      reloadChant = reload;

      const fileDialog = document.getElementById('file-dialog');
      const fileForm = document.getElementById('file-form');
      const moveDialog = document.getElementById('move-dialog');
      const moveForm = document.getElementById('move-form');

      fileForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        try {
          await postData('file_save', {
            id: fileForm.dataset.fileId,
            chant_id: chantId,
            nom_fichier: fileForm.elements.nom_fichier.value.trim(),
            tonalite: fileForm.elements.tonalite.value.trim(),
            nb_voix: fileForm.elements.nb_voix.value.trim(),
            accords: fileForm.elements.accords.checked ? '1' : '0',
            informations: fileForm.elements.informations.value.trim(),
          });
          fileDialog.close();
          currentChant = await reload();
        } catch (error) {
          window.alert(error.message);
        }
      });

      moveForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (movingFileId === null) {
          return;
        }

        try {
          await postData('file_move', {
            id: movingFileId,
            chant_id: moveForm.elements.chant_id.value,
          });
          moveDialog.close();
          movingFileId = null;
          currentChant = await reload();
        } catch (error) {
          window.alert(error.message);
        }
      });

      document.getElementById('move-search').addEventListener('input', renderMoveOptions);

      [fileDialog, moveDialog].forEach((element) => {
        element.querySelectorAll('[data-close-dialog]').forEach((button) => {
          button.addEventListener('click', () => element.close());
        });
      });

      try {
        currentChant = await reload();
      } catch (error) {
        document.getElementById('chant-content').innerHTML = `<p class="hint is-error">${escapeHtml(error.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
