<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebApp - Modification programme</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js"></script>
  <style>
    .editor-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      margin-top: 12px;
    }

    .editor-layout.is-preview-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .editor-layout.is-preview-hidden .editor-preview {
      display: none;
    }

    .editor-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 14px;
    }

    .editor-card h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .editor-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .editor-form-grid label {
      display: grid;
      gap: 4px;
      font-size: 0.9em;
    }

    .editor-form-grid input[type="text"],
    .editor-form-grid input[type="date"],
    .editor-form-grid input[type="search"],
    .editor-form-grid select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .editor-items {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .editor-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
    }

    .editor-item.is-partie {
      background: rgba(15, 118, 110, 0.08);
      font-weight: 600;
    }

    .editor-item-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: none;
      border: none;
      font: inherit;
      text-align: left;
      color: inherit;
      cursor: pointer;
      padding: 0;
    }

    .editor-item-sub {
      color: var(--ink-soft);
      font-weight: 400;
      font-size: 0.85em;
    }

    .editor-preview {
      position: sticky;
      top: 12px;
      height: 78vh;
      display: flex;
      flex-direction: column;
    }

    .editor-preview-frame {
      flex: 1;
      width: 100%;
      border: 0;
      border-radius: 10px;
    }

    .editor-dialog::backdrop {
      background: rgba(0, 0, 0, 0.45);
    }

    .editor-dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      min-width: min(460px, 92vw);
    }

    .editor-dialog .editor-form-grid {
      grid-template-columns: minmax(0, 1fr);
      margin-bottom: 16px;
    }

    .editor-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
  <script>
    (async () => {
      try {
        const AUTH_API = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.AUTH_API)
          || `${(window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || ''}webapp/api/auth.php`;
        const res = await fetch(`${AUTH_API}?action=check`, { credentials: 'include' });
        const data = await res.json();
        if (!data.success) {
          const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
          window.location.replace(`./login.html?return=${returnUrl}`);
        }
      } catch {
        const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
        window.location.replace(`./login.html?return=${returnUrl}`);
      }
    })();
  </script>
</head>
<body>
  <div class="editor-layout is-preview-hidden" id="editor-layout">
    <div>
      <section class="editor-card">
        <h2>Informations</h2>
        <form id="programme-form">
          <div class="editor-form-grid">
            <label>Date
              <input type="date" name="date" required />
            </label>
            <label>Paroisse
              <input type="text" name="paroisse" maxlength="255" list="paroisse-suggestions" />
              <datalist id="paroisse-suggestions"></datalist>
            </label>
            <label>Lieu
              <input type="text" name="lieu" maxlength="255" placeholder="Ville" />
            </label>
            <label>Occasion
              <input type="text" name="occasion" maxlength="255" placeholder="Messe ordinaire, Noel, mariage..." />
            </label>
          </div>
          <div class="editor-actions">
            <button type="submit" class="btn">Enregistrer les informations</button>
          </div>
        </form>
      </section>

      <section class="editor-card" style="margin-top: 16px;">
        <h2>Contenu du programme</h2>
        <div class="editor-actions" style="margin-top: 0;">
          <button id="add-partie" class="btn btn-ghost" type="button">Ajouter une partie</button>
          <button id="add-chant" class="btn" type="button">Ajouter un chant</button>
        </div>
        <ul id="editor-items" class="editor-items"></ul>
      </section>

      <p class="hint" id="editor-status" role="status">Chargement du programme...</p>
    </div>

    <section class="editor-card editor-preview">
      <h2>Apercu</h2>
      <iframe id="editor-preview-frame" class="editor-preview-frame" title="Apercu du fichier"></iframe>
      <div class="editor-actions">
        <button id="close-preview" class="btn btn-ghost" type="button">Fermer l'apercu</button>
      </div>
    </section>
  </div>

  <dialog id="chant-picker-dialog" class="editor-dialog">
    <form id="chant-picker-form" method="dialog">
      <h2>Ajouter un chant</h2>
      <div class="editor-form-grid">
        <label>Rechercher un chant
          <input id="chant-picker-search" type="search" placeholder="Nom du chant ou dossier" autocomplete="off" />
        </label>
        <label>Chant
          <select name="chant_id" size="8" required></select>
        </label>
        <label>Fichier associe
          <select name="fichier_id"></select>
        </label>
      </div>
      <div class="editor-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Ajouter</button>
      </div>
    </form>
  </dialog>

  <dialog id="partie-picker-dialog" class="editor-dialog">
    <form id="partie-picker-form" method="dialog">
      <h2>Ajouter une partie</h2>
      <div class="editor-form-grid">
        <label>Partie existante
          <select name="partie_id" size="8"></select>
        </label>
        <label>Ou nouvelle partie
          <input type="text" name="nouvelle_partie" maxlength="255" placeholder="Entree, Communion..." />
        </label>
      </div>
      <div class="editor-dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Annuler</button>
        <button type="submit" class="btn">Ajouter</button>
      </div>
    </form>
  </dialog>

  <script src="./modifications.js"></script>
</body>
</html>
