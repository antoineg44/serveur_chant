<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informations de la messe</title>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --line: #e2e8f0;
      --ink: #0f172a;
      --ink-soft: #475569;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #ecfeff 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
    }

    .messe-popup {
     overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.24);
      padding: 28px 28px 22px;
      position: relative;
      height: 100%;
      width: 100%;
      max-width: 1000px;
    }

    .messe-popup-title {
      margin: 0 0 14px;
      padding-right: 36px;
      font-size: clamp(1.5rem, 2vw, 2rem);
    }

    .messe-popup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .messe-popup-card {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .messe-popup-card strong {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .messe-popup-section {
      margin-top: 22px;
    }

    .messe-popup-section h3 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .messe-popup-description,
    .messe-popup-list,
    .messe-popup-empty {
      margin: 0;
      color: #334155;
      line-height: 1.7;
    }

    .messe-popup-description {
      white-space: pre-wrap;
    }

    .messe-popup-list {
      padding-left: 18px;
    }

    .messe-popup-program {
      display: grid;
      gap: 8px;
    }

    .messe-popup-program-part {
      margin-top: 8px;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
      font-weight: 700;
    }

    .messe-popup-program-song {
      padding: 10px 12px 10px 20px;
      border-bottom: 1px solid var(--line);
    }

    .messe-popup-program-song-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .messe-popup-program-song strong {
      display: block;
      color: var(--ink);
    }

    .messe-popup-program-song a {
      display: block;
      margin-top: 4px;
      color: var(--accent);
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    .chant-info-button {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #ffffff;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .chant-info-button:hover {
      background: var(--accent-soft);
    }

    .chant-info-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .messe-popup-loading {
      text-align: center;
      color: var(--ink-soft);
      padding: 24px 0;
    }

    .messe-popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .messe-popup-action-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    .messe-popup-action-button:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <main class="messe-popup" role="dialog" aria-modal="true" aria-labelledby="messe-popup-title">
    <h1 id="messe-popup-title" class="messe-popup-title">Informations de la messe</h1>
    <div id="messe-popup-content" class="messe-popup-content">
      <div class="messe-popup-loading">Chargement des informations…</div>
    </div>
  </main>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    function normalizePath(value) {
      return String(value || '')
        .replace(/\\/g, '/')
        .replace(/^\/+/, '')
        .replace(/\/+/g, '/');
    }

    function formatDisplayValue(value) {
      return String(value || '').trim() || '—';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      }[character]));
    }

    function parseFileMetadata(fileName) {
      const rawName = String(fileName || '').replace(/\.[^/.]+$/, '');
      const parts = rawName.split('_').map((part) => part.trim()).filter(Boolean);
      const metadata = { name: fileName, date: '', lieu: '', occasion: '' };

      if (parts.length >= 3) {
        metadata.date = parts[0];
        metadata.lieu = parts.slice(1, -1).join(' ');
        metadata.occasion = parts[parts.length - 1];
      } else if (parts.length === 2) {
        metadata.date = parts[0];
        metadata.lieu = parts[1];
      } else if (parts.length === 1) {
        metadata.date = parts[0];
      }

      return metadata;
    }

    function extractTextValue(text, key) {
      const prefix = `${key} =`;
      for (const line of String(text || '').split(/\r?\n/)) {
        const normalized = line.trim();
        if (normalized.startsWith(prefix)) {
          return normalized.slice(prefix.length).trim();
        }
      }
      return '';
    }

    function parseProgramText(text) {
      const lines = String(text || '').split(/\r?\n/);
      const output = {
        date: '',
        lieu: '',
        occasion: '',
        description: '',
        program: [],
      };

      const trimmedText = String(text || '').trim();
      if (trimmedText.startsWith('{')) {
        try {
          const json = JSON.parse(trimmedText);
          output.date = json.date || '';
          output.lieu = json.lieu || '';
          output.occasion = json.occasion || '';
          output.description = json.description || '';
          output.program = Array.isArray(json.chants) ? json.chants.map((item) => ({
            type: item.type === 'partie' ? 'partie' : 'chant',
            chantId: item.chantId || '',
            name: item.name || '',
            path: item.path || '',
          })) : [];
          return output;
        } catch (error) {
          console.warn('Format JSON du programme invalide.', error);
        }
      }

      const headerLine = lines.find((line) => line.includes('£'));
      if (headerLine) {
        const headerParts = headerLine.trim().split(/Â?£/);
        if (headerParts.length === 3) {
          output.date = headerParts[0].trim();
          output.lieu = headerParts[1].trim();
          output.occasion = headerParts[2].trim();
        }
      }

      const description = extractTextValue(String(text || ''), 'description');
      if (description) {
        output.description = description;
      }

      for (let index = 0; index < lines.length; index += 1) {
        const cleaned = lines[index].trim();
        if (!cleaned) {
          continue;
        }

        const sectionMatch = cleaned.match(/^\[(.+)\]$/);
        if (sectionMatch) {
          output.program.push({ type: 'partie', name: sectionMatch[1].trim(), path: '' });
          continue;
        }

        if (cleaned.startsWith('#')) {
          let path = '';
          const nextLine = lines[index + 1] ? lines[index + 1].trim() : '';
          if (nextLine.startsWith('path =')) {
            path = nextLine.slice('path ='.length).trim();
            index += 1;
          }
          output.program.push({ type: 'chant', name: cleaned.slice(1).trim(), path });
        }
      }

      return output;
    }

    async function fetchProgramText(filePath) {
      // Extract relative path from /pdf/... format
      const normalized = normalizePath(filePath);
      const relativePath = normalized.replace(/^pdf\//i, '');
      
      // Use the API endpoint like visualisation.js does
      const baseUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || '';
      const apiUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.EXPLORER_API)
        || `${baseUrl}webapp/api/explorer.php`;
      
      const query = new URLSearchParams({
        action: 'download',
        path: relativePath,
      }).toString();
      
      const response = await fetch(`${apiUrl}?${query}`, { credentials: 'include' });
      if (!response.ok) {
        throw new Error(`Impossible d'ouvrir le programme: ${response.status}`);
      }
      return response.text();
    }

    function renderPopup(data) {
      const title = document.getElementById('messe-popup-title');
      const container = document.getElementById('messe-popup-content');
      const programItems = (data.program || []).map((item) => {
        if (item.type === 'partie') {
          return `<div class="messe-popup-program-part">${escapeHtml(item.name)}</div>`;
        }

        const path = String(item.path || '').trim();
        const pathMarkup = path
          ? `<a href="#" data-chant-path="${escapeHtml(path)}">${escapeHtml(path)}</a>`
          : '<span>Aucun fichier associé</span>';
        const chantId = Number.isInteger(Number(item.chantId)) && Number(item.chantId) > 0
          ? String(Number(item.chantId))
          : '';
        const infoButton = path
          ? `<button type="button" class="chant-info-button" title="Informations du chant" aria-label="Informations de ${escapeHtml(item.name)}" data-chant-info-path="${escapeHtml(path)}" data-chant-info-name="${escapeHtml(item.name)}"${chantId ? ` data-chant-info-id="${chantId}"` : ''}>i</button>`
          : '<button type="button" class="chant-info-button" title="Aucun fichier associe" aria-label="Informations indisponibles" disabled>i</button>';
        return `<div class="messe-popup-program-song"><div class="messe-popup-program-song-row"><strong>${escapeHtml(item.name)}</strong>${infoButton}</div>${pathMarkup}</div>`;
      }).join('');

      const titleText = data.title || 'Informations de la messe';
      title.textContent = data.lieu ? `${titleText} - ${data.lieu}` : titleText;
      container.innerHTML = `
        <div class="messe-popup-section">
          <h3>Action</h3>
          <div class="messe-popup-actions">
            <button type="button" class="messe-popup-action-button" data-action="modify">Modifier</button>
            <button type="button" class="messe-popup-action-button" data-action="visualize">Visualiser</button>
            <button type="button" class="messe-popup-action-button" data-action="zip">Créer un zip</button>
            <button type="button" class="messe-popup-action-button" data-action="complete-zip">Créer un zip complet avec les fichiers dérivés</button>
            <button type="button" class="messe-popup-action-button" data-action="copy">Copier le lien du programme</button>
          </div>
        </div>
        
        <div class="messe-popup-grid">
          <div class="messe-popup-card"><strong>Paroisse</strong><span>${formatDisplayValue(data.paroisse)}</span></div>
          <div class="messe-popup-card"><strong>Date</strong><span>${formatDisplayValue(data.date)}</span></div>
          <div class="messe-popup-card"><strong>Lieu</strong><span>${formatDisplayValue(data.lieu)}</span></div>
          <div class="messe-popup-card"><strong>Occasion</strong><span>${formatDisplayValue(data.occasion)}</span></div>
        </div>

        <div class="messe-popup-section">
          <h3>Description</h3>
          <p class="messe-popup-description">${escapeHtml(formatDisplayValue(data.description))}</p>
        </div>

        <div class="messe-popup-section">
          <h3>Programme</h3>
          <div class="messe-popup-program">${programItems || '<p class="messe-popup-empty">Aucun chant ou partie repertorie.</p>'}</div>
        </div>
      `;

      const programmePath = String(data.path || '').trim();
      const programmeId = String(data.programmeId || '').trim();
      const normalizedProgrammePath = normalizePath(programmePath).replace(/^pdf\//i, '');
      const pdfProgrammePath = `/pdf/${normalizedProgrammePath}`;
      const programmeQuery = encodeURIComponent(pdfProgrammePath);
      const baseUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || '';
      const programmeFileUrl = `${(window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.PDF_ROOT) || '../pdf/'}${normalizedProgrammePath
        .split('/')
        .filter(Boolean)
        .map((segment) => encodeURIComponent(segment))
        .join('/')}`;
      const apiUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.EXPLORER_API)
        || `${baseUrl}webapp/api/explorer.php`;
      const programmeApiUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.PROGRAMME_API)
        || `${baseUrl}webapp/api/programme.php`;
      const shareUrl = programmeId
        ? `${window.location.origin}${window.location.pathname}?programmeId=${encodeURIComponent(programmeId)}`
        : programmeFileUrl;
      const actionUrls = {
        modify: programmeId
          ? `./modifications.html?programmeId=${encodeURIComponent(programmeId)}`
          : `./modifications.html?programme=${programmeQuery}`,
        visualize: programmeId
          ? `./visualisation.html?programmeId=${encodeURIComponent(programmeId)}`
          : `./visualisation.html?programme=${programmeQuery}`,
        zip: programmeId
          ? `${programmeApiUrl}?action=download_zip&id=${encodeURIComponent(programmeId)}`
          : `${apiUrl}?action=download_program&path=${encodeURIComponent(programmePath)}`,
        'complete-zip': programmeId
          ? `${programmeApiUrl}?action=download_zip&complete=1&id=${encodeURIComponent(programmeId)}`
          : `${apiUrl}?action=download_program_complete&path=${encodeURIComponent(programmePath)}`,
      };

      async function copyProgrammeLink(button) {
        const originalLabel = button.textContent;
        let copied = false;

        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(shareUrl);
            copied = true;
          } catch (error) {
            copied = false;
          }
        }

        if (!copied) {
          const textarea = document.createElement('textarea');
          textarea.value = shareUrl;
          textarea.setAttribute('readonly', 'readonly');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          copied = document.execCommand('copy');
          textarea.remove();
        }

        button.textContent = copied ? 'Lien copié' : 'Copie impossible';
        window.setTimeout(() => {
          button.textContent = originalLabel;
        }, 1600);
      }

      function openAction(action, actionUrl) {
        if ((action === 'modify' || action === 'visualize') && window.parent && window.parent !== window) {
          const actionLabel = action === 'modify' ? 'Modifier' : 'Visualiser';
          window.parent.postMessage({
            type: 'openPageTab',
            item: {
              key: `${action}-programme-${programmeId || programmePath}`,
              name: `${actionLabel} - ${data.name || 'Programme'}`,
              title: `${actionLabel} - ${data.name || 'Programme'}`,
              description: actionLabel,
              url: actionUrl,
            },
          }, '*');
          return;
        }

        window.open(actionUrl, '_blank', 'noopener,noreferrer');
      }

      container.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.dataset.action === 'copy') {
            void copyProgrammeLink(button);
            return;
          }

          const actionUrl = actionUrls[button.dataset.action];
          if (!actionUrl || (!programmePath && !programmeId)) {
            return;
          }

          openAction(button.dataset.action, actionUrl);
        });
      });
      container.querySelectorAll('[data-chant-path]').forEach((link) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();

          const chantPath = link.dataset.chantPath;
          const params = new URLSearchParams({ lien: `/${normalizePath(chantPath)}` });
          if (programmeId) {
            params.set('programmeId', programmeId);
          }
          const viewerUrl = `./visualisation.html?${params.toString()}`;

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'openPageTab',
              item: {
                key: `visualisation-${chantPath}`,
                name: chantPath.split('/').pop() || 'Chant',
                title: chantPath.split('/').pop() || 'Chant',
                description: 'Visualisation',
                url: viewerUrl,
              },
            }, '*');
            return;
          }

          window.open(viewerUrl, '_blank', 'noopener,noreferrer');
        });
      });

      container.querySelectorAll('[data-chant-info-path]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();

          const isEmbedded = Boolean(window.parent && window.parent !== window);
          const infoWindow = isEmbedded ? null : window.open('about:blank', '_blank');
          if (!isEmbedded && !infoWindow) {
            return;
          }

          void openChantInfo(button.dataset.chantInfoPath, button.dataset.chantInfoId, infoWindow, button.dataset.chantInfoName);
        });
      });
    }

    function goToChantDescription(chantId, infoWindow, fileName, fileBaseName) {
      const params = new URLSearchParams({ chantId: String(chantId) });
      if (fileBaseName) {
        params.set('file', fileBaseName);
      }
      const url = `./description.html?${params.toString()}`;
      const name = fileName || 'Chant';

      if (window.parent && window.parent !== window) {
        infoWindow?.close();
        window.parent.postMessage({
          type: 'openPageTab',
          item: {
            key: `chant-${chantId}`,
            name,
            title: `Informations - ${name}`,
            description: 'Informations du chant',
            url,
          },
        }, '*');
        return;
      }

      if (infoWindow) {
        infoWindow.location.href = url;
      } else {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    async function openChantInfo(filePath, chantId, infoWindow, fileName) {
      const fileBaseName = String(filePath || '').split('/').pop() || '';

      if (chantId) {
        goToChantDescription(chantId, infoWindow, fileName, fileBaseName);
        return;
      }

      const baseUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || '';
      const apiUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.DATA_API)
        || `${baseUrl}webapp/api/data.php`;
      const query = new URLSearchParams({
        action: 'chant_by_file',
        path: normalizePath(filePath).replace(/^pdf\//i, ''),
      }).toString();

      try {
        const response = await fetch(`${apiUrl}?${query}`, { credentials: 'include' });
        const payload = await response.json().catch(() => null);
        if (response.status === 401) {
          infoWindow?.close();
          redirectToLogin();
          return;
        }
        if (!response.ok || !payload || !payload.success || !payload.chantId) {
          throw new Error((payload && payload.message) || 'Informations du chant indisponibles.');
        }

        goToChantDescription(payload.chantId, infoWindow, fileName, fileBaseName);
      } catch (error) {
        infoWindow?.close();
        console.error(error);
      }
    }

    function redirectToLogin() {
      const returnUrl = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
      window.location.replace(`./login.html?return=${returnUrl}`);
    }

    async function ensureAuthenticated() {
      const baseUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || '';
      const AUTH_API = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.AUTH_API)
        || `${baseUrl}webapp/api/auth.php`;

      try {
        const response = await fetch(`${AUTH_API}?action=check`, { credentials: 'include' });
        const payload = await response.json().catch(() => ({ success: false }));

        if (!response.ok || !payload.success) {
          redirectToLogin();
          return false;
        }

        return true;
      } catch (error) {
        redirectToLogin();
        return false;
      }
    }

    async function loadProgrammeFromDatabase(id) {
      const baseUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.BASE_URL) || '';
      const apiUrl = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.PROGRAMME_API)
        || `${baseUrl}webapp/api/programme.php`;

      const query = new URLSearchParams({ action: 'detail', id }).toString();
      const response = await fetch(`${apiUrl}?${query}`, { credentials: 'include' });
      const payload = await response.json().catch(() => null);

      if (!response.ok || !payload || !payload.success) {
        throw new Error((payload && payload.message) || `Impossible de charger le programme: ${response.status}`);
      }

      const programme = payload.programme;
      const program = (payload.items || []).map((item) => (item.type === 'partie'
        ? { type: 'partie', name: item.partieNom, path: '' }
        : {
          type: 'chant',
          name: item.chantNom,
          chantId: item.chantId,
          path: [item.chantPath, item.chantNom, item.nomFichier].filter(Boolean).join('/'),
        }));

      renderPopup({
        title: programme.occasion ? `${programme.date} - ${programme.occasion}` : 'Informations de la messe',
        name: [programme.date, programme.lieu, programme.occasion].filter(Boolean).join(' - '),
        path: '',
        programmeId: programme.id,
        date: programme.date,
        lieu: programme.lieu,
        occasion: programme.occasion,
        paroisse: programme.paroisse,
        description: programme.description || '',
        program,
      });
    }

    async function loadProgramInfo() {
      if (!(await ensureAuthenticated())) {
        return;
      }

      const programmeId = getQueryParam('programmeId');
      if (programmeId) {
        try {
          await loadProgrammeFromDatabase(programmeId);
        } catch (error) {
          document.getElementById('messe-popup-content').innerHTML =
            `<p class="messe-popup-empty">${escapeHtml(error.message)}</p>`;
        }
        return;
      }

      const programmePath = getQueryParam('programme');
      if (!programmePath) {
        document.getElementById('messe-popup-content').innerHTML = '<p class="messe-popup-empty">Aucune messe sélectionnée.</p>';
        return;
      }

      const fileName = programmePath.split('/').pop() || 'programme';
      const fileInfo = parseFileMetadata(fileName);
      const baseInfo = {
        title: fileInfo.occasion ? `${fileInfo.date || 'Messe'} - ${fileInfo.occasion}` : 'Informations de la messe',
        name: fileName,
        path: programmePath,
        date: fileInfo.date,
        lieu: fileInfo.lieu,
        occasion: fileInfo.occasion,
        description: '',
        program: [],
      };

      renderPopup(baseInfo);

      try {
        const text = await fetchProgramText(programmePath);
        const parsed = parseProgramText(text);
        renderPopup({
          ...baseInfo,
          date: parsed.date || baseInfo.date,
          lieu: parsed.lieu || baseInfo.lieu,
          occasion: parsed.occasion || baseInfo.occasion,
          description: parsed.description,
          program: parsed.program,
        });
      } catch (error) {
        console.error(error);
        renderPopup({
          ...baseInfo,
          description: 'Le fichier de programme a été chargé, mais ses informations n ont pas pu être lues.'
        });
      }
    }

    void loadProgramInfo();
  </script>
</body>
</html>
