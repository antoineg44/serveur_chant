<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informations de la messe</title>
  <script src="./config.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --line: #e2e8f0;
      --ink: #0f172a;
      --ink-soft: #475569;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #ecfeff 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .messe-popup {
      width: min(820px, 100%);
      max-height: min(82vh, 820px);
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.24);
      padding: 28px 28px 22px;
      position: relative;
    }

    .messe-popup-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f9;
      color: var(--ink);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }

    .messe-popup-title {
      margin: 0 0 14px;
      padding-right: 36px;
      font-size: clamp(1.5rem, 2vw, 2rem);
    }

    .messe-popup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .messe-popup-card {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .messe-popup-card strong {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .messe-popup-section {
      margin-top: 22px;
    }

    .messe-popup-section h3 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .messe-popup-description,
    .messe-popup-list,
    .messe-popup-empty {
      margin: 0;
      color: #334155;
      line-height: 1.7;
    }

    .messe-popup-list {
      padding-left: 18px;
    }

    .messe-popup-loading {
      text-align: center;
      color: var(--ink-soft);
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <main class="messe-popup" role="dialog" aria-modal="true" aria-labelledby="messe-popup-title">
    <button id="messe-popup-close" class="messe-popup-close" aria-label="Fermer" type="button">×</button>
    <h1 id="messe-popup-title" class="messe-popup-title">Informations de la messe</h1>
    <div id="messe-popup-content" class="messe-popup-content">
      <div class="messe-popup-loading">Chargement des informations…</div>
    </div>
  </main>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    function normalizePath(value) {
      return String(value || '')
        .replace(/\\/g, '/')
        .replace(/^\/+/, '')
        .replace(/\/+/g, '/');
    }

    function formatDisplayValue(value) {
      return String(value || '').trim() || '—';
    }

    function parseFileMetadata(fileName) {
      const rawName = String(fileName || '').replace(/\.[^/.]+$/, '');
      const parts = rawName.split('_').map((part) => part.trim()).filter(Boolean);
      const metadata = { name: fileName, date: '', lieu: '', occasion: '' };

      if (parts.length >= 3) {
        metadata.date = parts[0];
        metadata.lieu = parts.slice(1, -1).join(' ');
        metadata.occasion = parts[parts.length - 1];
      } else if (parts.length === 2) {
        metadata.date = parts[0];
        metadata.lieu = parts[1];
      } else if (parts.length === 1) {
        metadata.date = parts[0];
      }

      return metadata;
    }

    function extractTextValue(text, key) {
      const prefix = `${key} =`;
      for (const line of String(text || '').split(/\r?\n/)) {
        const normalized = line.trim();
        if (normalized.startsWith(prefix)) {
          return normalized.slice(prefix.length).trim();
        }
      }
      return '';
    }

    function parseProgramText(text) {
      const lines = String(text || '').split(/\r?\n/);
      const output = {
        date: '',
        lieu: '',
        occasion: '',
        description: '',
        sections: [],
        chants: [],
      };

      const headerLine = lines.find((line) => line.includes('£'));
      if (headerLine) {
        const match = headerLine.match(/^(\d{4}-\d{2}-\d{2})£([^£]+)£([^£]+)$/);
        if (match) {
          output.date = match[1];
          output.lieu = match[2].trim();
          output.occasion = match[3].trim();
        }
      }

      const description = extractTextValue(String(text || ''), 'description');
      if (description) {
        output.description = description;
      }

      for (const line of lines) {
        const cleaned = line.trim();
        if (!cleaned) {
          continue;
        }

        const sectionMatch = cleaned.match(/^\[(.+)\]$/);
        if (sectionMatch) {
          output.sections.push(sectionMatch[1].trim());
        }

        if (cleaned.startsWith('#')) {
          output.chants.push(cleaned.slice(1).trim());
        }
      }

      return output;
    }

    async function fetchProgramText(filePath) {
      const configRoot = (window.WEBAPP_CONFIG && window.WEBAPP_CONFIG.PDF_ROOT) || '../pdf/';
      const normalized = normalizePath(filePath);
      const encodedPath = normalized
        .split('/')
        .filter(Boolean)
        .map((segment) => encodeURIComponent(segment))
        .join('/');
      const response = await fetch(`${configRoot}${encodedPath}`, { credentials: 'include' });
      if (!response.ok) {
        throw new Error(`Impossible d'ouvrir le programme: ${response.status}`);
      }
      return response.text();
    }

    function renderPopup(data) {
      const title = document.getElementById('messe-popup-title');
      const container = document.getElementById('messe-popup-content');
      const listItems = (data.chants || []).length
        ? (data.chants || []).map((chant) => `<li>${chant}</li>`).join('')
        : '<li>Aucun chant listé dans le programme.</li>';

      title.textContent = data.title || 'Informations de la messe';
      container.innerHTML = `
        <div class="messe-popup-grid">
          <div class="messe-popup-card"><strong>Nom</strong><span>${formatDisplayValue(data.name)}</span></div>
          <div class="messe-popup-card"><strong>Date</strong><span>${formatDisplayValue(data.date)}</span></div>
          <div class="messe-popup-card"><strong>Lieu</strong><span>${formatDisplayValue(data.lieu)}</span></div>
          <div class="messe-popup-card"><strong>Occasion</strong><span>${formatDisplayValue(data.occasion)}</span></div>
          <div class="messe-popup-card"><strong>Fichier</strong><span>${formatDisplayValue(data.path)}</span></div>
        </div>

        <div class="messe-popup-section">
          <h3>Description</h3>
          <p class="messe-popup-description">${formatDisplayValue(data.description)}</p>
        </div>

        <div class="messe-popup-section">
          <h3>Sections</h3>
          <p class="messe-popup-empty">${(data.sections || []).length ? data.sections.join(' • ') : 'Aucune section repertoriee.'}</p>
        </div>

        <div class="messe-popup-section">
          <h3>Chants</h3>
          <ul class="messe-popup-list">${listItems}</ul>
        </div>
      `;
    }

    async function loadProgramInfo() {
      const programmePath = getQueryParam('programme');
      if (!programmePath) {
        document.getElementById('messe-popup-content').innerHTML = '<p class="messe-popup-empty">Aucune messe sélectionnée.</p>';
        return;
      }

      const fileName = programmePath.split('/').pop() || 'programme';
      const fileInfo = parseFileMetadata(fileName);
      const baseInfo = {
        title: fileInfo.occasion ? `${fileInfo.date || 'Messe'} - ${fileInfo.occasion}` : 'Informations de la messe',
        name: fileName,
        path: programmePath,
        date: fileInfo.date,
        lieu: fileInfo.lieu,
        occasion: fileInfo.occasion,
        description: '',
        sections: [],
        chants: [],
      };

      renderPopup(baseInfo);

      try {
        const text = await fetchProgramText(programmePath);
        const parsed = parseProgramText(text);
        renderPopup({
          ...baseInfo,
          date: parsed.date || baseInfo.date,
          lieu: parsed.lieu || baseInfo.lieu,
          occasion: parsed.occasion || baseInfo.occasion,
          description: parsed.description,
          sections: parsed.sections,
          chants: parsed.chants,
        });
      } catch (error) {
        console.error(error);
        renderPopup({
          ...baseInfo,
          description: 'Le fichier de programme a été chargé, mais ses informations n ont pas pu être lues.'
        });
      }
    }

    document.getElementById('messe-popup-close').addEventListener('click', () => {
      window.close();
    });

    void loadProgramInfo();
  </script>
</body>
</html>
